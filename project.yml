# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# (Codemagic does this automatically; see codemagic.yaml.)
name: ShittyFriends

options:
  bundleIdPrefix: com.sakara
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Required by `agvtool new-version` (Codemagic sets the build number with it).
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    # Codemagic's `xcode-project use-profiles` switches signing to manual with the fetched profiles.
    CODE_SIGN_STYLE: Automatic

targets:
  ShittyFriends:
    type: application
    platform: iOS
    sources:
      - path: ShittyFriends
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakara.shittyfriends
        PRODUCT_NAME: ShittyFriends
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ShittyFriends/ShittyFriends.entitlements
        INFOPLIST_FILE: ShittyFriends/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - target: NotificationService
        embed: true
        codeSign: true
      - target: PoopingLiveActivity
        embed: true
        codeSign: true

  PoopingLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PoopingLiveActivity
      - path: ShittyFriends/Core/Shared/PoopingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakara.shittyfriends.PoopingLiveActivity
        PRODUCT_NAME: PoopingLiveActivity
        CODE_SIGN_ENTITLEMENTS: PoopingLiveActivity/PoopingLiveActivity.entitlements
        INFOPLIST_FILE: PoopingLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      # Shared with the app: ping format, notification text, directory, tokens, AES sealing.
      - path: ShittyFriends/Core/Shared/Pings.swift
      - path: ShittyFriends/Core/Models/Identity.swift
      - path: ShittyFriends/Services/Crypto/AESSealer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakara.shittyfriends.NotificationService
        PRODUCT_NAME: NotificationService
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        INFOPLIST_FILE: NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  ShittyFriendsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShittyFriendsTests
    dependencies:
      - target: ShittyFriends
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakara.shittyfriends.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  ShittyFriends:
    build:
      targets:
        ShittyFriends: all
        ShittyFriendsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ShittyFriendsTests
    archive:
      config: Release
