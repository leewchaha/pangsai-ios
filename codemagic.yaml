# Codemagic workflows for ShittyFriends (native iOS, XcodeGen, Firebase backend).
#
#   ios-check        Build + unit tests on the simulator. No signing, no secrets. Run this first and
#                    paste the log back if anything fails. Works without a Firebase config (the app
#                    then runs local-only in tests).
#   ios-testflight   Signed App Store build, uploaded to TestFlight. Uses the Codemagic
#                    integration and stored signing identities for all three signed targets, and the
#                    Firebase config from the `firebase` environment group.
#   firebase-deploy  Deploys Firestore rules/indexes and the Cloud Functions (firebase/) with a
#                    service account from the `firebase` environment group.
#
# Secrets live in Codemagic Apple Developer Portal integrations / Code Signing Identities and in the
# `firebase` environment group, never in this repo. See docs/SETUP.md.

definitions:
  scripts:
    - &install_xcodegen
      name: Install XcodeGen
      script: |
        if ! command -v xcodegen >/dev/null 2>&1; then
          brew install xcodegen
        fi
        xcodegen --version
    - &generate_project
      name: Generate Xcode project
      script: xcodegen generate
    - &firebase_config_optional
      name: Install Firebase config (GoogleService-Info.plist, optional)
      script: |
        # GOOGLE_SERVICE_INFO_PLIST = base64 of the GoogleService-Info.plist downloaded from the
        # Firebase console (group `firebase`, Secret). Without it the app builds and runs local-only.
        set -eu
        if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ShittyFriends/Resources/GoogleService-Info.plist
          plutil -lint ShittyFriends/Resources/GoogleService-Info.plist
          REVERSED=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ShittyFriends/Resources/GoogleService-Info.plist 2>/dev/null || true)
          if [ -n "$REVERSED" ]; then
            # Google sign-in needs its redirect scheme in Info.plist.
            sed -i '' "s#REVERSED_CLIENT_ID_PLACEHOLDER#$REVERSED#" ShittyFriends/Info.plist
            echo "Google sign-in redirect scheme installed."
          else
            echo "No REVERSED_CLIENT_ID in the Firebase config: Google sign-in stays hidden (Sign in with Apple only)."
          fi
          echo "Firebase config installed."
        else
          echo "GOOGLE_SERVICE_INFO_PLIST not set: building without Firebase config (local-only app)."
        fi

workflows:
  ios-check:
    name: ShittyFriends · build check (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - firebase
    scripts:
      - *install_xcodegen
      - *generate_project
      - *firebase_config_optional
      - name: Build and run unit tests on a simulator
        script: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(ids[-1] if ids else "")
          ')
          echo "Simulator: $SIM_ID"
          LOG="$CM_BUILD_DIR/xcodebuild.log"
          set +e
          xcodebuild \
            -project ShittyFriends.xcodeproj \
            -scheme ShittyFriends \
            -destination "id=$SIM_ID" \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test > "$LOG" 2>&1
          STATUS=$?
          set -e
          grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test|\*\* (BUILD|TEST)" "$LOG" | tail -20 || true
          if [ "$STATUS" != "0" ]; then
            echo "================ ERRORS (paste these to Claude) ================"
            grep -E "error:|failed \(" "$LOG" | sort -u | head -200
            exit "$STATUS"
          fi
    artifacts:
      - xcodebuild.log

  ios-testflight:
    name: ShittyFriends · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Wall App Store Connect Key
    environment:
      xcode: latest
      groups:
        - firebase
      ios_signing:
        distribution_type: app_store
        # Needs matching App Store profiles for BOTH embedded extensions.
        bundle_identifier: com.sakara.shittyfriends
      vars:
        BUNDLE_ID: com.sakara.shittyfriends
        NSE_BUNDLE_ID: com.sakara.shittyfriends.NotificationService
        LIVE_ACTIVITY_BUNDLE_ID: com.sakara.shittyfriends.PoopingLiveActivity
        APP_STORE_APPLE_ID: 6819505355
        XCODE_PROJECT: ShittyFriends.xcodeproj
        XCODE_SCHEME: ShittyFriends
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Require the Firebase config for a signed build
        script: |
          set -eu
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo 'ERROR: GOOGLE_SERVICE_INFO_PLIST is not set. Add it (Secret, base64 of GoogleService-Info.plist) to the Codemagic environment group named exactly "firebase".' >&2
            echo '       A TestFlight build without it cannot sign in, sync or add friends.' >&2
            exit 2
          fi
      - *firebase_config_optional
      - name: Validate App Store orientation metadata
        script: python3 scripts/verify_appstore_metadata.py
      # Signing files are fetched from Codemagic Code Signing Identities for all three targets.
      # Configure all three provisioning profiles + Apple Distribution certificate in the Codemagic UI.
      - name: Preflight App Store provisioning profiles (all three targets)
        script: python3 scripts/verify_signing_profiles.py
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT" --archive-method app-store
      - name: Verify Release signing assignments (all three targets)
        script: python3 scripts/verify_signing_profiles.py --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --check-assignments
      - name: Set build number
        script: |
          # Never turn authentication/API failures into build 1, which may collide
          # with an existing TestFlight build. Empty *successful* result means new app.
          set -eu
          if ! LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID"); then
            echo 'ERROR: Cannot query TestFlight build number. Check the Codemagic app_store_connect integration.' >&2
            exit 1
          fi
          LATEST=${LATEST:-0}
          case "$LATEST" in
            *[!0-9]*) echo "ERROR: Invalid TestFlight build number (not numeric)." >&2; exit 1 ;;
          esac
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          agvtool new-version -all "$NEXT"
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  firebase-deploy:
    name: ShittyFriends · Firebase rules + functions deploy
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 20
      groups:
        # FIREBASE_PROJECT_ID (plain) and FIREBASE_SERVICE_ACCOUNT (Secret: the JSON of a service
        # account with the Firebase Admin / Cloud Functions Developer roles). See docs/SETUP.md §2.
        - firebase
    scripts:
      - name: Check credentials
        script: |
          set -eu
          if [ -z "${FIREBASE_PROJECT_ID:-}" ] || [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo 'ERROR: FIREBASE_PROJECT_ID and FIREBASE_SERVICE_ACCOUNT must be set in the Codemagic environment group "firebase".' >&2
            exit 2
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CM_BUILD_DIR/firebase-service-account.json"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$CM_BUILD_DIR/firebase-service-account.json"
      - name: Install firebase-tools and function dependencies
        script: |
          set -eu
          npm install -g firebase-tools
          cd firebase/functions
          npm ci
          npm run build
      - name: Deploy Firestore rules, indexes and Cloud Functions
        script: |
          set -eu
          export GOOGLE_APPLICATION_CREDENTIALS="$CM_BUILD_DIR/firebase-service-account.json"
          cd firebase
          firebase deploy --only firestore:rules,firestore:indexes,functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force
      - name: Remove credentials
        script: rm -f "$CM_BUILD_DIR/firebase-service-account.json"
